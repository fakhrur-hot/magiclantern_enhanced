name: Build AI Magic Lantern

# REQ-005: build Magic Lantern firmware for the camera matrix and publish the
# binaries + unified.tbl as artifacts. release.yml triggers on this workflow's
# successful completion (matched by the name above).

on:
  push:
    branches: [ai-lut-integration]
  pull_request:
    branches: [ai-lut-integration]
  schedule:
    - cron: "0 2 * * *"   # nightly 02:00 UTC

env:
  # Root of the vendored Magic Lantern source. The spec references the build
  # path as platform/<camera>/; in this repo the source lives under source-dev/.
  # Set to "." once the ML source is promoted to the repo root.
  ML_SRC_ROOT: source-dev

jobs:
  build:
    name: Build ${{ matrix.camera }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one camera failing must not cancel the others
      matrix:
        camera: [6D.116, 5D3.113, 60D.111, 650D.104]
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain and build deps
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make zip python3

      - name: Restore executable bit on build scripts
        # A fresh checkout does not preserve the +x bit on the ML build helper
        # scripts (e.g. build_tools/git_summary.py). Without it, version.bin
        # fails with "Permission denied" (Error 126) and no binary is produced.
        run: find "${ML_SRC_ROOT}" -type f \( -name '*.py' -o -name '*.sh' \) -exec chmod +x {} +

      - name: Build ${{ matrix.camera }}
        run: |
          cd "${ML_SRC_ROOT}/platform/${{ matrix.camera }}"
          # Builds the complete installer (build/magiclantern.zip with ML-SETUP.FIR)
          # where the camera's FIR is vendored (6D.116). For cameras without a
          # vendored FIR the zip step fails non-fatally; magiclantern.bin is still
          # produced. make || true keeps the matrix alive.
          make clean && make || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: magiclantern-${{ matrix.camera }}
          # make produces the binary under the platform's build/ subdir
          path: ${{ env.ML_SRC_ROOT }}/platform/${{ matrix.camera }}/build/magiclantern.bin
          if-no-files-found: warn   # absent binary is expected on build failure

      - name: Package full AI Magic Lantern installer
        # Single deliverable: the COMPLETE flashable installer (full ML tree +
        # ML-SETUP.FIR) with the AI-LUT payload injected. AI files are STORED
        # (uncompressed) so the camera reads plain files -- no on-camera
        # decompression (tools/make_full_bundle.py). Produced only when the full
        # installer zip built (i.e. the camera's FIR is vendored).
        run: |
          BASE="${ML_SRC_ROOT}/platform/${{ matrix.camera }}/build/magiclantern.zip"
          if [ -f "$BASE" ]; then
            python3 tools/make_full_bundle.py \
              --base-zip "$BASE" \
              --out "ai-magiclantern-${{ matrix.camera }}.zip"
          else
            echo "No full installer for ${{ matrix.camera }} (ML-SETUP.FIR not vendored); skipping."
          fi

      - name: Upload full installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-magiclantern-${{ matrix.camera }}
          path: ai-magiclantern-${{ matrix.camera }}.zip
          if-no-files-found: warn   # absent for cameras without a vendored FIR

  package-lut:
    name: Package unified LUT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload unified.tbl artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-lut
          path: models/unified.tbl
          if-no-files-found: error
